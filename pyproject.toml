[project]
name = "navi-personal-assistant"
version = "0.1.0"
description = "Local, persistent personal assistant with a shared CLI and Web gateway"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
pythonpath = ["backend", "engineering/verification"]
testpaths = ["engineering/verification/tests"]
cache_dir = "engineering/verification/.pytest_cache"
asyncio_mode = "auto"
